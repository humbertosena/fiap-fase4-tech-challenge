[project]
name = "credit-sentinel"
dynamic = ["version"]
description = "Camada de sustentação e confiabilidade de um modelo de credit scoring: contratos de dados, detecção de drift, observabilidade e governança LGPD"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Humberto Sena Santos", email = "humbertosena@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "evidently>=0.7,<0.8",
    "jinja2>=3.1",
    "joblib>=1.4",
    "mlflow>=3.0",
    "numpy>=2.0",
    "pandas>=2.2,<3",  # Evidently 0.7.x não importa com pandas 3
    "pandera>=0.26,<1.0",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.6",
    "scipy>=1.14",
]

[project.scripts]
credit-sentinel = "credit_sentinel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/credit_sentinel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_sentinel"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
notebook = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "missingno>=0.5",
    "nbconvert>=7.16",
    "seaborn>=0.13",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["ALL"]
# Conflitos Google/formatter; política de copyright não se aplica ao projeto acadêmico.
ignore = ["D203", "D213", "COM812", "CPY001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
# Modelos pydantic precisam dos tipos das anotações em tempo de execução.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.pylint]
max-statements = 20
max-branches = 6
max-args = 5

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "INP001", "PLR2004", "D103", "PLC0415"]
"scripts/*.py" = ["INP001", "T201"]
"src/credit_sentinel/cli.py" = ["T201"]
"src/credit_sentinel/**/commands.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
filterwarnings = [
    "error",
    # MLflow 3.18 usa a estratégia `noload` do SQLAlchemy 2.1 no tracking SQLite.
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
    # Aviso interno do MLflow 3.x ao inspecionar o `predict` do pyfunc sklearn.
    "ignore:.*Any type hint is inferred as AnyType:UserWarning",
    # Evidently 0.7 importa `numpy.core`, renomeado para `numpy._core` no NumPy 2.
    "ignore:numpy.core is deprecated:DeprecationWarning",
    # Evidently 0.7 tem strings com `\\d` sem prefixo `r`; o Python 3.12 avisa ao compilar.
    "ignore:.*invalid escape sequence:SyntaxWarning",
    # O Evidently importa o Litestar (UI), que já avisa sobre APIs removidas na 3.0.
    "ignore:Call to deprecated function 'Dependency':DeprecationWarning",
    "ignore:Use of deprecated class 'DependencyKwarg':DeprecationWarning",
]
markers = [
    "unit: testes unitários isolados",
    "integration: integração entre componentes",
    "schema: contratos e schemas de dados",
    "smoke: verificação mínima de funcionamento",
    "performance: medições de desempenho (fora da CI)",
]

[tool.coverage.run]
source = ["credit_sentinel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
