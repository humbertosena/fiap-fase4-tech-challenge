# MLflow Tracking Server local (UI em http://localhost:5001; a 5000 é do AirPlay no macOS).
# O diretório ./mlruns é montado no MESMO caminho absoluto do host, para que o
# servidor enxergue tanto o SQLite quanto os artefatos gravados pela CLI local
# (CS_MLFLOW_TRACKING_URI=sqlite:///mlruns/mlflow.db, executada na raiz do repo).
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    container_name: credit-sentinel-mlflow
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:///${PWD}/mlruns/mlflow.db
      - --default-artifact-root=${PWD}/mlruns/artifacts
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:${PWD}/mlruns
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/health')
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
