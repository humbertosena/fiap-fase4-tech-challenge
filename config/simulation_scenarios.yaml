# Parâmetros do processo gerador de dados (ADR 001).
# `reference` define todos os parâmetros; os cenários de produção (Etapa 2)
# sobrescrevem apenas o que muda, sob a chave `params`.
scenarios:
  reference:
    description: Carteira de referência (treino), economia estável.
    period:
      start: 2025-07-01
      end: 2026-06-30
    params:
      female_share: 0.51
      region_shares:
        Sudeste: 0.42
        Nordeste: 0.27
        Sul: 0.14
        Norte: 0.09
        Centro-Oeste: 0.08
      region_income_factor:
        Sudeste: 1.10
        Sul: 1.05
        Centro-Oeste: 1.00
        Nordeste: 0.80
        Norte: 0.85
      employment_shares:
        CLT: 0.52
        autonomo: 0.22
        servidor_publico: 0.10
        aposentado: 0.09
        desempregado: 0.07
      employment_income_factor:
        servidor_publico: 1.25
        aposentado: 0.80
        desempregado: 0.35
      purpose_shares:
        veiculo: 0.22
        reforma: 0.18
        educacao: 0.10
        consolidacao_dividas: 0.20
        saude: 0.08
        outros: 0.22
      term_shares:
        6: 0.08
        12: 0.22
        24: 0.30
        36: 0.22
        48: 0.12
        60: 0.06
      income_median: 3800.0
      income_sigma: 0.55
      income_real_factor: 1.0
      income_min: 800.0
      income_max: 60000.0
      score_noise_sd: 60.0
      debt_noise_sd: 0.5
      debt_logit_shift: 0.0
      utilization_shift: 0.0
      monthly_interest: 0.025
      max_installment_ratio: 0.6
      # Calibrado por `calibrate_intercept(params, 0.06, make_rng(2024))`.
      beta0: -3.3067
      beta0_adjustment: 0.0
      gamma_concept: 0.0
      coef_commitment: 0.8

  # Janelas de produção (Etapa 2): cada uma sobrescreve só o que muda em `reference`.
  # `rows` é o tamanho do lote; a semente é 42 + posição da janela (ver `load_windows`).
  mes_1:
    description: Julho/2026 — controle estacionário, sem mudança de população.
    period:
      start: 2026-07-01
      end: 2026-07-31
    rows: 5000
    params: {}

  mes_2:
    description: Agosto/2026 — início da pressão inflacionária (covariate shift).
    period:
      start: 2026-08-01
      end: 2026-08-31
    rows: 5000
    params:
      income_real_factor: 0.90
      debt_logit_shift: 0.35
      utilization_shift: 0.06
      monthly_interest: 0.030
      # CLT absorve a alta do desemprego (0,07 → 0,09).
      employment_shares:
        CLT: 0.50
        autonomo: 0.22
        servidor_publico: 0.10
        aposentado: 0.09
        desempregado: 0.09
      # consolidação de dívidas 0,20 → 0,26; demais finalidades em proporção.
      purpose_shares:
        veiculo: 0.2035
        reforma: 0.1665
        educacao: 0.0925
        consolidacao_dividas: 0.26
        saude: 0.074
        outros: 0.2035
      # Peso maior da parcela no risco. Sem ajuste residual de intercepto: os choques
      # de covariável já levam a taxa base de 6,5 % a ~8,6 % (ADR 004).
      coef_commitment: 1.0
      beta0_adjustment: 0.0

  mes_3_crise:
    description: Setembro/2026 — choque de juros com covariate, prior e concept drift.
    period:
      start: 2026-09-01
      end: 2026-09-30
    rows: 5000
    params:
      income_real_factor: 0.80
      debt_logit_shift: 0.70
      utilization_shift: 0.20
      monthly_interest: 0.038
      # CLT cai: o desemprego sobe de 0,07 para 0,12.
      employment_shares:
        CLT: 0.47
        autonomo: 0.22
        servidor_publico: 0.10
        aposentado: 0.09
        desempregado: 0.12
      # consolidação de dívidas 0,20 → 0,34; demais finalidades em proporção.
      purpose_shares:
        veiculo: 0.1815
        reforma: 0.1485
        educacao: 0.0825
        consolidacao_dividas: 0.34
        saude: 0.066
        outros: 0.1815
      # Concept drift: risco extra na faixa 550–700 de score e peso maior da parcela.
      gamma_concept: 1.5
      coef_commitment: 1.6
      # Covariáveis e conceito, sozinhos, levariam a taxa a ~18 %. O intercepto
      # residual, calibrado por bisseção na janela entregue (semente fixa) para 13 %,
      # representa o aperto da concessão de crédito (ADR 004).
      beta0_adjustment: -0.64
