name: ci-quality-gates

on:
  push:
    branches: [main, "etapa/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint e formatação (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --locked
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .

  tests:
    name: testes e cobertura (pytest)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --locked
      - name: Pytest (sem testes de performance)
        run: >-
          uv run pytest -m "not performance"
          --cov=credit_sentinel --cov-report=term-missing --cov-fail-under=85

  smoke:
    name: smoke do pipeline e varredura de PII
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --locked
      - name: Pipeline em janela estável (modo rápido)
        run: uv run credit-sentinel run-pipeline --window mes_1 --quick --no-mlflow
      - name: Lote corrompido deve ser bloqueado (exit 2 com --strict)
        run: >-
          uv run credit-sentinel run-pipeline --window bad_batch --quick
          --no-mlflow --strict && exit 1 || test $? -eq 2
      - name: Varredura de PII em relatórios, documentação e logs
        run: uv run credit-sentinel scan-pii reports docs logs
